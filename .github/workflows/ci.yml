name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        laravel: ['9', '10', '11', '12']
        include:
          - laravel: '9'
            testbench: '7'
          - laravel: '10'
            testbench: '8'
          - laravel: '11'
            testbench: '9'
          - laravel: '12'
            testbench: '10'
        exclude:
          - laravel: '9'
            php: '8.4'
          - laravel: '11'
            php: '8.1'
          - laravel: '12'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin the Laravel version through Testbench
        run: composer require --dev "orchestra/testbench:^${{ matrix.testbench }}.0" --no-update --no-interaction

      # Laravel 9 is past its security-fix window, so Composer refuses it by default.
      - name: Allow packages with published advisories
        if: matrix.laravel == '9'
        run: composer config policy.advisories.block false

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: composer validate --strict
      - run: composer lint
      - run: composer analyse
      - run: composer test
